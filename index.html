<style>
/* Concept : carnet de chantier de poche — une colonne, barre d'onglets en bas, chiffres en mono, jaune de signalisation pour le prix de vente. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface2:#f6f8f9; --line:#d5dbe0; --fg:#1b2329; --muted:#5d6b75;
  --accent:#f2b705; --accent-ink:#1b2329; --accent-soft:#fdf3cf;
  --mo:#3f6fa8; --mat:#c4692b; --four:#5e8a3a; --st:#7a5aa6; --evac:#8d7b5a;
  --ok:#2e7d4f; --warn:#b26a00; --bad:#b3261e; --warn-bg:#fff4e0; --bad-bg:#fde8e6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1a2127; --surface2:#20282f; --line:#313c45; --fg:#e6ebee; --muted:#9aa8b2;
  --accent:#f5c22a; --accent-ink:#12171b; --accent-soft:#3a3214;
  --mo:#7aa6dc; --mat:#e08a4d; --four:#8cbb62; --st:#a98bd6; --evac:#bba57c;
  --ok:#5fbf86; --warn:#e3a33c; --bad:#ef6b62; --warn-bg:#3a2c12; --bad-bg:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1a2127; --surface2:#20282f; --line:#313c45; --fg:#e6ebee; --muted:#9aa8b2;
  --accent:#f5c22a; --accent-ink:#12171b; --accent-soft:#3a3214;
  --mo:#7aa6dc; --mat:#e08a4d; --four:#8cbb62; --st:#a98bd6; --evac:#bba57c;
  --ok:#5fbf86; --warn:#e3a33c; --bad:#ef6b62; --warn-bg:#3a2c12; --bad-bg:#3d1c1a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:56px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.45rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:1.25rem}
h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.88rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input[type=text],input[type=search],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 10px;min-height:42px}
input.numin{font-family:var(--f-mono);text-align:right}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;padding:12px 4px 10px;font-family:var(--f-display);font-size:1.02rem;font-weight:600;letter-spacing:.03em;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tab[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.ok{color:var(--ok)}
.alert{border-radius:8px;padding:10px 12px;font-size:.92rem}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--surface2);color:var(--muted)}
/* liste des ouvrages */
.ouv-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;cursor:pointer}
.ouv-item:hover{border-color:var(--muted)}
.ouv-item .code{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ouv-item .des{font-weight:600;overflow-wrap:anywhere}
.ouv-item .pv{text-align:right;font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.ouv-item .pv small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:500}
/* résumé collant */
.sumbar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);padding-block:8px}
.sumbar .card{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 14px}
.kpi .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1}
.kpi.pv .val{background:var(--accent);color:var(--accent-ink);display:inline-block;padding:0 8px;border-radius:5px}
.bar{grid-column:1/-1;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* blocs */
.bloc{border-left:4px solid var(--c);padding-left:12px}
.bloc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bloc-head h3{color:var(--c)}
.bloc-head .tot{margin-left:auto;font-family:var(--f-mono);font-weight:500}
.ligne{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ligne .top{display:flex;gap:8px;align-items:flex-start}
.ligne .nom{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.ligne .calc{font-size:.84rem;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.ligne .calc b{color:var(--fg);font-weight:500}
.lib-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.lib-item .pu{font-family:var(--f-mono);text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
table.res{width:100%;border-collapse:collapse;font-size:.92rem}
table.res td{padding:6px 0;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-family:var(--f-mono)}
table.res tr.big td{font-family:var(--f-display);font-size:1.15rem;font-weight:700;border-bottom:0}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 12px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;text-align:left}
.steps li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;flex:none;display:grid;place-items:center}
.steps{padding:0;margin:0}
.target{background:var(--accent-soft);border-color:transparent}
/* devis */
.dv-line{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.dv-line:first-child,.dv-chap+.dv-line{border-top:0}
.dv-line .hd,.dv-chap{display:flex;gap:6px;align-items:flex-start}
.dv-line .des{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.dv-line .des small{display:block;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:400}
.dv-line .des:hover span{text-decoration:underline}
.dv-line .nums{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.dv-line .ro{font-family:var(--f-mono);padding:10px 2px;text-align:right;white-space:nowrap}
.dv-line .ro.tot{font-weight:500}
.dv-chap{align-items:flex-start;padding-block:14px 6px;border-top:2px solid var(--fg)}
.dv-chap:first-child{border-top:0;padding-top:0}
.dv-chap input{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.03em}
.dv-chap .st{font-family:var(--f-mono);white-space:nowrap;font-weight:500}
.mv{display:flex;flex:none}
.mv .btn,.dv-line .hd>.btn,.dv-chap>.btn{min-width:34px;padding-inline:6px}
@media (prefers-reduced-motion:no-preference){.btn,.tab{transition:background .15s,border-color .15s}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

<body>


<header class="top"><div class="in">
  <button class="btn ghost sm" id="backBtn" hidden aria-label="Retour à la liste">← Liste</button>
  <h1 id="title">Ouvrages</h1>
  <span class="pill" id="hdrPill" hidden></span>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabbar" aria-label="Sections"><div class="in">
  <button class="tab" data-view="list" id="tab-list">Ouvrages</button>
  <button class="tab" data-view="devis" id="tab-devis">Devis</button>
  <button class="tab" data-view="lib" id="tab-lib">Bibliothèque</button>
  <button class="tab" data-view="set" id="tab-set">Réglages</button>
</div></nav>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
/* ---------- données ---------- */
const KEY='sdp_vrd_v1';
const CATS={MO:{nom:"Main-d'œuvre",c:'--mo'},MAT:{nom:'Matériel',c:'--mat'},FOUR:{nom:'Matériaux',c:'--four'},ST:{nom:'Sous-traitance',c:'--st'},EVAC:{nom:'Évacuation',c:'--evac'}};
const UNITES_OUV=['m²','ml','m³','t','U','J','H','Ft'];
const UNITES_MAT=['t','m³','m²','ml','U','kg','sac','l'];
const uid=()=>Math.random().toString(36).slice(2,10);
function defaults(){
  const L=(cat,nom,unite)=>({id:uid(),cat,nom,unite,pu:null,remise:0,transport:0,famille:''});
  return {v:1,
    settings:{hj:8,kMode:'construit',kDirect:1.15,pct:{enc:5,sec:0.5,mag:0.5,siege:14,etu:0.5},ba:2,kST:1.23,arrondi:true},
    lib:[
      L('MO','Chef de chantier','h'),L('MO',"Chef d'équipe",'h'),L('MO','Ouvrier / compagnon','h'),L('MO',"Conducteur d'engins",'h'),L('MO','Chauffeur PL','h'),
      L('MAT','Pelle sur pneus < 18 t','j'),L('MAT','Mini-pelle < 10 t','j'),L('MAT','Camion 8×4','j'),L('MAT','Camion 8×4 grue','j'),L('MAT','Finisseur','j'),L('MAT','Compacteur tandem','j'),L('MAT','Plaque vibrante','j'),L('MAT','Tronçonneuse / scie à sol','j'),
      L('FOUR','BBSG 0/10','t'),L('FOUR','GNT 0/31,5','t'),L('FOUR','Sable 0/4','t'),L('FOUR','Béton C25/30','m³'),L('FOUR','Mortier','m³'),L('FOUR','Bordure T2','ml'),L('FOUR','Décharge CL3 inertes','t'),
      L('ST','Sous-traitance (à nommer)','U')
    ],
    ouv:[],devis:[]};
}
let S;
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const d=JSON.parse(raw); if(d&&d.v===1&&d.settings&&Array.isArray(d.lib)&&Array.isArray(d.ouv)) return d;}}catch(e){}
  return defaults();
}
let storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
S=load();
if(!Array.isArray(S.devis))S.devis=[];

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v===null||v===undefined)return null;if(typeof v==='number')return isFinite(v)?v:null;const t=String(v).replace(/\s/g,'').replace(',','.');if(t==='')return null;const n=Number(t);return isFinite(n)?n:null}
const nf=(d)=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const F2=nf(2),F3=nf(3),F0=nf(0);
function eur(v,d=2){return v===null||v===undefined||!isFinite(v)?'—':(d===0?F0:F2).format(v)+' €'}
function fx(v,d=2){if(v===null||v===undefined||!isFinite(v))return '—';return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:d}).format(v)}
function inval(v){return v===null||v===undefined?'':String(v).replace('.',',')}
const ceilCent=x=>Math.ceil(Math.round(x*1e6)/1e4)/100;
function toast(msg){const h=$('#toastHost');h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}

/* ---------- coefficients et calcul ---------- */
function coefK(){const s=S.settings;if(s.kMode==='direct')return num(s.kDirect)||1;const p=s.pct;const fg=1+((num(p.enc)||0)+(num(p.sec)||0)+(num(p.mag)||0)+(num(p.siege)||0)+(num(p.etu)||0))/100;return fg*(1+(num(s.ba)||0)/100)}
function libGet(id){return S.lib.find(x=>x.id===id)||null}
function lineRes(l){ // valeurs effectives d'une ligne (bibliothèque ou ligne libre)
  const b=l.ref?libGet(l.ref):null;
  const o={nom:b?b.nom:(l.nom||'Ligne libre'),unite:b?b.unite:(l.unite||''),famille:b?b.famille:'',libPU:b?num(b.pu):null};
  const ov=num(l.puSpec);
  o.pu=ov!==null?ov:(b?num(b.pu):num(l.pu));
  o.remise=b?(num(b.remise)||0):(num(l.remise)||0);
  o.transport=b?(num(b.transport)||0):(num(l.transport)||0);
  o.missing=o.pu===null;
  o.broken=!!l.ref&&!b;
  return o;
}
function compute(o){
  const s=S.settings,K=coefK(),kST=num(s.kST)||1;
  const R=num(o.r);const Q=num(o.q);
  const dpu=R&&R>0?1/R:1; // jours par unité
  const blocs={MO:0,MAT:0,FOUR:0,ST:0,EVAC:0};
  let A=0,B=0,Sst=0; const det=[]; const warn=[];
  for(const l of o.lignes){
    const d={l,bloc:l.bloc,parts:[]};
    if(l.bloc==='MO'||l.bloc==='MAT'){
      const r=lineRes(l); const nb=num(l.nb)??0; const isH=(r.unite||'').toLowerCase()==='h'; const hj=isH?(num(l.hj)??s.hj):1;
      const parJour=nb*hj*(r.pu||0); const u=parJour*dpu;
      d.r=r;d.parJour=parJour;d.u=u;d.qteJour=nb*hj;d.isH=isH;d.hj=hj;d.nb=nb;
      A+=parJour; blocs[l.bloc]+=u;
      if(r.missing)warn.push('Prix manquant : '+r.nom);
    }else if(l.bloc==='FOUR'||l.bloc==='ST'){
      const r=lineRes(l); const ratio=num(l.ratio)??0; const pertes=num(l.pertes)||0;
      const punet=l.bloc==='FOUR'?(r.pu||0)*(1-r.remise/100)+r.transport:(r.pu||0);
      const qu=ratio*(1+pertes/100); const u=qu*punet;
      d.r=r;d.ratio=ratio;d.qu=qu;d.punet=punet;d.u=u;d.pertes=pertes;
      if(l.bloc==='ST'){Sst+=u}else{B+=u}
      blocs[l.bloc]+=u;
      if(r.missing)warn.push('Prix manquant : '+r.nom);
    }else if(l.bloc==='EVAC'){
      const cam=lineRes({ref:l.camion}),chf=lineRes({ref:l.chauffeur}),dch=lineRes({ref:l.decharge});
      const tu=num(l.tu)??0,tpj=num(l.tpj)||0,hj=num(l.hj)??s.hj;
      const jcam=tpj>0?tu/tpj:0, hch=jcam*hj, tdech=tu;
      const uc=jcam*(cam.pu||0),uh=hch*(chf.pu||0),ud=tdech*(dch.pu||0); const u=uc+uh+ud;
      d.cam=cam;d.chf=chf;d.dch=dch;d.jcam=jcam;d.hch=hch;d.tdech=tdech;d.uc=uc;d.uh=uh;d.ud=ud;d.u=u;d.tu=tu;d.tpj=tpj;d.hj=hj;
      B+=u;blocs.EVAC+=u;
      if(!(tpj>0)&&tu>0)warn.push('Évacuation : indique les tonnes transportées par camion et par jour');
      [cam,chf,dch].forEach(x=>{if(l.camion||l.chauffeur||l.decharge){if(x.missing&&!x.broken)warn.push('Prix manquant : '+x.nom)}});
    }
    det.push(d);
  }
  const ds=blocs.MO+blocs.MAT+blocs.FOUR+blocs.ST+blocs.EVAC;
  const pvRaw=K*(ds-blocs.ST)+kST*blocs.ST;
  const pv=s.arrondi?ceilCent(pvRaw):Math.round(pvRaw*100)/100;
  const res={R,Q,dpu,blocs,ds,K,kST,pvRaw,pv,A,B,Sst,det,warn:[...new Set(warn)]};
  if(!(R>0)&&A>0)res.noR=true;
  if(Q>0){res.dsTot=ds*Q;res.pvTot=pv*Q;res.marge=res.pvTot-res.dsTot;res.duree=R>0?Q/R:null}
  return res;
}
function rendementCible(res,target){ // R tel que PV = cible
  const s=S.settings; const T=s.arrondi?target-0.001:target;
  const den=T-res.K*res.B-res.kST*res.Sst;
  if(!(res.A>0))return {err:'Aucune ligne de main-d’œuvre ou de matériel : le rendement ne change pas le prix.'};
  if(den<=0)return {err:'Impossible : les matériaux, l’évacuation et la sous-traitance dépassent déjà ce prix de vente.'};
  return {R:res.K*res.A/den};
}

      el.addEventListener(ev,()=>{l[k]=isNum?(el.value.trim()===''?null:num(el.value)):el.value;touch(o);if(el.dataset.rerender||el.tagName==='SELECT'&&l.bloc!=='EVAC')renderEdit();else refresh(o)});

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateFr(s){if(!s)return '';const d=new Date(s+'T12:00');return isNaN(d)?s:d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}
function touchDv(dv){dv.upd=Date.now();save()}
function curDv(){return S.devis.find(d=>d.id===curId)}
// Le devis reprend en direct le prix de vente de chaque ouvrage (calculé par son sous-détail) × la quantité du devis
function computeDevis(dv){
  const blocs={MO:0,MAT:0,FOUR:0,ST:0,EVAC:0}; const rows=[]; const warn=[]; const chaps=[];
  let ht=0,ds=0,jours=0,chap=null,nOuv=0;
  for(const l of dv.lignes){
    if(l.type==='chap'){chap={l,ht:0};chaps.push(chap);rows.push({l,chap:true,c:chap});continue}
    const o=S.ouv.find(x=>x.id===l.ouvId); const q=num(l.q)||0;
    if(!o){rows.push({l,missing:true});warn.push('Un ouvrage du devis a été supprimé : retire la ligne.');continue}
    nOuv++;
    const r=compute(o); const tot=Math.round(r.pv*q*100)/100;
    ht+=tot; ds+=r.ds*q; for(const b in blocs)blocs[b]+=r.blocs[b]*q; if(chap)chap.ht+=tot; if(r.R>0&&q>0)jours+=q/r.R;
    if(r.warn.length||r.noR)warn.push((o.code||o.des||'Ouvrage')+' : sous-détail à compléter.');
    if(!(q>0))warn.push((o.des||o.code||'Ouvrage')+' : quantité à saisir.');
    rows.push({l,o,r,q,tot});
  }
  const tva=num(dv.tva)??20;
  return {rows,chaps,nOuv,ht,ds,marge:ht-ds,blocs,tva,tvaAmt:Math.round(ht*tva)/100,ttc:Math.round(ht*(100+tva))/100,jours,warn:[...new Set(warn)]};
}

const CAT_LBL={MO:"Main-d'œuvre",MAT:'Matériel',FOUR:'Matériaux',ST:'Sous-traitance'};
const normTxt=v=>String(v??'').toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function catOf(v){const t=normTxt(v);if(!t)return null;
  if(/^(mo|main d oeuvre|main oeuvre|personnel)/.test(t))return 'MO';
  if(/^(mat|materiel|engin)/.test(t)&&!/^materiau/.test(t))return 'MAT';
  if(/^(four|fourniture|materiau|materiaux)/.test(t))return 'FOUR';
  if(/^(st|sous traitance|soustraitance)/.test(t))return 'ST';
  return null}
function cellNum(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const t=String(v).replace(/[\s  €%]/g,'').replace(',','.');if(t==='')return null;const n=Number(t);return isFinite(n)?n:NaN}
function libTemplate(){

  const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[16,40,8,11,10,18,14].map(w=>({wch:w}));

function previewImport(rows){
  // repère la ligne de titres et les colonnes, quel que soit leur ordre
  const want={cat:/^(categorie|bloc|type)/,nom:/^(nom|designation|libelle|ressource|article)/,unite:/^(unite|uo|u)$/,pu:/^(prix|pu|tarif|cout)/,remise:/^(remise|ristourne)/,transport:/^(transport|port)/,famille:/^(code famille|famille|code)/};
  let hi=-1,col={};
  for(let i=0;i<Math.min(rows.length,10)&&hi<0;i++){const c={};rows[i].forEach((v,j)=>{const t=normTxt(v);for(const k in want)if(c[k]===undefined&&want[k].test(t)){c[k]=j;break}});if(c.nom!==undefined&&c.pu!==undefined){hi=i;col=c}}
  if(hi<0){sheet('<h2>Colonnes introuvables</h2><p class="small" style="margin:0">Je n’ai pas trouvé les colonnes « Nom » et « Prix ». Pars du modèle (bouton « Télécharger le modèle Excel ») et garde la ligne de titres.</p><button class="btn" id="imX">Fermer</button>',()=>$('#imX').addEventListener('click',closeSheet));return}
  const get=(r,k)=>col[k]===undefined?'':r[col[k]];
  const upd=[],add=[],skip=[],seen=new Set();
  rows.slice(hi+1).forEach((r,i)=>{const line=hi+i+2;
    const nom=String(get(r,'nom')??'').trim();if(!nom){if(r.some(v=>String(v).trim()))skip.push('Ligne '+line+' : pas de nom');return}
    const unite=String(get(r,'unite')??'').trim();
    let cat=catOf(get(r,'cat')),guess=false;
    if(!cat){const ex=S.lib.filter(x=>normTxt(x.nom)===normTxt(nom));if(ex.length===1)cat=ex[0].cat;else{guess=true;cat=/^h$/i.test(unite)?'MO':/^j$/i.test(unite)?'MAT':'FOUR'}}
    const pu=cellNum(get(r,'pu')),rem=cellNum(get(r,'remise')),tr=cellNum(get(r,'transport')),fam=String(get(r,'famille')??'').trim();
    if(Number.isNaN(pu)||(pu!==null&&pu<0)){skip.push('Ligne '+line+' ('+nom+') : prix illisible « '+get(r,'pu')+' »');return}
    if((cat==='MO'||cat==='MAT')&&unite&&!/^[hj]$/i.test(unite)){skip.push('Ligne '+line+' ('+nom+') : unité « '+unite+' » impossible pour '+CAT_LBL[cat]+' (h ou j)');return}
    const key=cat+'|'+normTxt(nom);if(seen.has(key)){skip.push('Ligne '+line+' ('+nom+') : en double dans le fichier');return}seen.add(key);
    const x=S.lib.find(y=>y.cat===cat&&normTxt(y.nom)===normTxt(nom));
    const ch={};
    if(pu!==null)ch.pu=pu;
    if(unite)ch.unite=(cat==='MO'||cat==='MAT')?unite.toLowerCase():unite;
    if(cat==='FOUR'){if(rem!==null&&!Number.isNaN(rem))ch.remise=rem;if(tr!==null&&!Number.isNaN(tr))ch.transport=tr}
    if(fam)ch.famille=fam;
    if(x){const diff=Object.keys(ch).filter(k=>String(num(x[k])??x[k]??'')!==String(ch[k]));if(diff.length)upd.push({x,ch,diff})}
    else add.push({cat,nom,ch,guess});
  });
  const used=id=>S.ouv.filter(o=>o.lignes.some(l=>l.ref===id||l.camion===id||l.chauffeur===id||l.decharge===id)).length;
  const fmtV=(k,v)=>k==='pu'||k==='transport'?(v===null||v===undefined||v===''?'—':eur(num(v))):k==='remise'?fx(num(v)||0)+' %':esc(v||'—');
  const KL={pu:'prix',unite:'unité',remise:'remise',transport:'transport',famille:'famille'};
  let h='<div class="row"><h2 class="grow">Vérifier l’import</h2><button class="btn ghost" id="imX">Annuler</button></div>';
  if(!upd.length&&!add.length){h+='<div class="alert info">Rien à changer : ta bibliothèque est déjà à jour.</div>'}
  if(upd.length){h+='<h3>'+upd.length+' mise'+(upd.length>1?'s':'')+' à jour</h3><table class="res"><tbody>'+upd.map(u=>{const n=used(u.x.id);return '<tr><td>'+esc(u.x.nom)+'<br><span class="small muted">'+CAT_LBL[u.x.cat]+(n?' · utilisé dans '+n+' ouvrage'+(n>1?'s':''):'')+'</span></td><td>'+u.diff.map(k=>'<span class="small muted">'+KL[k]+'</span> '+fmtV(k,u.x[k])+' → <b>'+fmtV(k,u.ch[k])+'</b>').join('<br>')+'</td></tr>'}).join('')+'</tbody></table>'}
  if(add.length){h+='<h3>'+add.length+' nouvelle'+(add.length>1?'s':'')+' ligne'+(add.length>1?'s':'')+'</h3><table class="res"><tbody>'+add.map(a=>'<tr><td>'+esc(a.nom)+'<br><span class="small muted">'+CAT_LBL[a.cat]+(a.guess?' <span class="pill warn">catégorie devinée</span>':'')+'</span></td><td>'+(a.ch.pu!==undefined?eur(a.ch.pu):'<span class="pill warn">prix à saisir</span>')+(a.ch.unite?' / '+esc(a.ch.unite):'')+'</td></tr>').join('')+'</tbody></table>'}
  if(skip.length)h+='<div class="alert warn"><b>'+skip.length+' ligne'+(skip.length>1?'s ignorées':' ignorée')+'</b><br>'+skip.slice(0,12).map(esc).join('<br>')+(skip.length>12?'<br>…':'')+'</div>';
  const affected=new Set(upd.flatMap(u=>S.ouv.filter(o=>o.lignes.some(l=>l.ref===u.x.id||l.camion===u.x.id||l.chauffeur===u.x.id||l.decharge===u.x.id)).map(o=>o.id))).size;
  if(affected)h+='<p class="small muted" style="margin:0">'+affected+' ouvrage'+(affected>1?'s':'')+' et les devis qui les utilisent seront recalculés.</p>';
  if(upd.length||add.length)h+='<div class="row"><button class="btn primary" id="imGo">Appliquer ('+(upd.length+add.length)+')</button></div>';
  sheet(h,()=>{$('#imX').addEventListener('click',closeSheet);
    const go=$('#imGo');if(go)go.addEventListener('click',()=>{
      upd.forEach(u=>Object.assign(u.x,u.ch));
      add.forEach(a=>S.lib.push({id:uid(),cat:a.cat,nom:a.nom,unite:a.ch.unite||({MO:'h',MAT:'j',FOUR:'t',ST:'U'})[a.cat],pu:a.ch.pu??null,remise:a.ch.remise||0,transport:a.ch.transport||0,famille:a.ch.famille||''}));
      save();closeSheet();renderLib();toast((upd.length?upd.length+' mis à jour':'')+(upd.length&&add.length?' · ':'')+(add.length?add.length+' ajouté'+(add.length>1?'s':''):''))});
  });
}

  h+='<div class="card stack"><h3>Coefficient de vente</h3><div class="seg" role="group" aria-label="Mode du coefficient"><button data-km="construit" aria-pressed="'+(s.kMode==='construit')+'">Construit (%)</button><button data-km="direct" aria-pressed="'+(s.kMode==='direct')+'">K direct</button></div>';
  if(s.kMode==='direct')h+='<div class="grid2">'+pf('s-kd','K',s.kDirect)+'</div>';
  else h+='<p class="small muted" style="margin:0">Frais généraux = 1 + somme des % · K = frais généraux × (1 + bénéfice et aléas). Valeurs de départ reprises de ton cadre de sous-détail 26EV14 : à vérifier.</p><div class="grid3">'+pf('s-enc','Encadrement %',s.pct.enc)+pf('s-sec','Sécurité %',s.pct.sec)+pf('s-mag','Magasin %',s.pct.mag)+pf('s-sie','Siège %',s.pct.siege)+pf('s-etu','Études %',s.pct.etu)+pf('s-ba','Bénéfice et aléas %',s.ba)+'</div>';
  h+='<div class="grid2">'+pf('s-kst','Coefficient sous-traitance',s.kST)+pf('s-hj','Heures par jour',s.hj)+'</div>';
  h+='<div class="row"><span class="muted">K appliqué</span><span class="mono" id="kOut" style="font-size:1.2rem;font-weight:500">'+F3.format(K)+'</span></div>';
  h+='<label class="row" style="gap:8px"><input type="checkbox" id="s-arr"'+(s.arrondi?' checked':'')+'> Arrondir le prix de vente au centime supérieur</label></div>';
  h+='<div class="card stack"><h3>Sauvegarde</h3><p class="small" style="margin:0">Tout est enregistré dans ce navigateur, sur ce téléphone. Si tu vides les données de Safari ou changes de téléphone, tout est perdu. Fais une sauvegarde régulière.</p>'+
    '<div class="row"><button class="btn primary" id="bkJson">Télécharger la sauvegarde</button><button class="btn" id="bkXlsx">Exporter les ouvrages (Excel QDV)</button></div>'+
    '<div class="field"><label for="bkIn">Restaurer une sauvegarde (.json)</label><input type="file" id="bkIn" accept=".json,application/json"></div><div id="bkMsg"></div>'+
    '<div class="row"><button class="btn" id="bkCopy">Copier la sauvegarde</button></div></div>';
  h+='<div class="card stack"><h3>Tout effacer</h3><p class="small muted" style="margin:0">Supprime ouvrages, devis, bibliothèque et réglages de ce navigateur.</p><div class="row"><button class="btn danger" id="wipe">Tout effacer</button></div></div>';
  h+='<p class="small muted">'+S.ouv.length+' ouvrage(s) · '+S.devis.length+' devis · '+S.lib.length+' ressource(s) en bibliothèque · K = '+F3.format(K)+'</p></div>';
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-km]').forEach(b=>b.addEventListener('click',()=>{s.kMode=b.dataset.km;save();renderSet()}));
  const bind=(id,set)=>{const el=$('#'+id);if(el)el.addEventListener('input',()=>{set(num(el.value));save();$('#kOut').textContent=F3.format(coefK())})};
  bind('s-kd',v=>s.kDirect=v);bind('s-enc',v=>s.pct.enc=v);bind('s-sec',v=>s.pct.sec=v);bind('s-mag',v=>s.pct.mag=v);bind('s-sie',v=>s.pct.siege=v);bind('s-etu',v=>s.pct.etu=v);bind('s-ba',v=>s.ba=v);bind('s-kst',v=>s.kST=v);bind('s-hj',v=>s.hj=v??8);
  $('#s-arr').addEventListener('change',e=>{s.arrondi=e.target.checked;save()});
  $('#bkJson').addEventListener('click',()=>saveFile('Sauvegarde calculette '+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1)));
  $('#bkXlsx').addEventListener('click',()=>S.ouv.length?exportXLSX(S.ouv,'Sous-details QDV'):toast('Aucun ouvrage à exporter'));
  $('#bkCopy').addEventListener('click',()=>copyText(JSON.stringify(S),'Sauvegarde copiée'));
  $('#bkIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!(d&&d.v===1&&d.settings&&Array.isArray(d.lib)&&Array.isArray(d.ouv)))throw 0;
      $('#bkMsg').innerHTML='<div class="alert warn">Ce fichier contient '+d.ouv.length+' ouvrage(s), '+(Array.isArray(d.devis)?d.devis.length:0)+' devis et '+d.lib.length+' ressource(s). Il remplacera tout ce qui est dans la calculette.</div><div class="row"><button class="btn primary" id="bkGo">Remplacer par cette sauvegarde</button></div>';
      $('#bkGo').addEventListener('click',()=>{S=d;if(!Array.isArray(S.devis))S.devis=[];save();toast('Sauvegarde restaurée');renderSet()});
    }catch(_){$('#bkMsg').innerHTML='<div class="alert bad">Ce fichier n’est pas une sauvegarde de la calculette.</div>'}};rd.readAsText(f)});
  armDelete($('#wipe'),()=>{S=defaults();save();toast('Tout est effacé');setView('list')},'Confirmer : tout effacer');
}

/* ---------- export ---------- */
function saveFile(name,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.json')?'application/json':'application/octet-stream'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);toast('Fichier prêt : '+name);
  }catch(e){toast('Téléchargement impossible sur ce navigateur')}
}
function qdvRows(o){
  const r=compute(o);const Q=r.Q>0?r.Q:1;const dur=r.R>0?Q/r.R:Q;const rows=[];
  rows.push(['',o.code||'','',o.des||'',o.unite,'',r.Q>0?r.Q:'','','','','','','']);
  rows.push([1,'','Ouv.',o.des||'',o.unite,'[QEval]',+dur.toFixed(4),Q,r.R>0?r.R:'','','','','']);
  let n=2;
  for(const d of r.det){
    if(d.bloc==='MO'||d.bloc==='MAT'){const qt=d.qteJour*dur;rows.push([n++,'','Art.',d.r.nom,(d.r.unite||'').toUpperCase(),d.qteJour,+qt.toFixed(4),'','',d.r.pu??'',+(qt*(d.r.pu||0)/Q).toFixed(4),+(qt*(d.r.pu||0)).toFixed(2),d.r.famille||CATS[d.bloc].nom])}
    else if(d.bloc==='FOUR'||d.bloc==='ST'){const qt=d.qu*Q;rows.push([n++,'','Art.',d.r.nom+(d.bloc==='ST'?' (ST)':''),d.r.unite,'[Ratio]*'+String(+d.qu.toFixed(6)),+qt.toFixed(4),'','',+d.punet.toFixed(4),+(d.u).toFixed(4),+(d.u*Q).toFixed(2),d.r.famille||CATS[d.bloc].nom])}
    else if(d.bloc==='EVAC'){
      const camJ=d.jcam*Q,hch=d.hch*Q,t=d.tdech*Q;
      rows.push([n++,'','Art.',d.cam.nom,'J','[Ratio]*'+(+d.tu.toFixed(6))+'/'+(+d.tpj.toFixed(4)),+camJ.toFixed(4),'','',d.cam.pu??'',+d.uc.toFixed(4),+(d.uc*Q).toFixed(2),d.cam.famille||'Évacuation']);
      rows.push([n++,'','Art.',d.chf.nom,'H','[Ratio]*'+(+d.tu.toFixed(6))+'/'+(+d.tpj.toFixed(4))+'*'+d.hj,+hch.toFixed(4),'','',d.chf.pu??'',+d.uh.toFixed(4),+(d.uh*Q).toFixed(2),d.chf.famille||'Évacuation']);
      rows.push([n++,'','Art.',d.dch.nom,'T','[Ratio]*'+(+d.tu.toFixed(6)),+t.toFixed(4),'','',d.dch.pu??'',+d.ud.toFixed(4),+(d.ud*Q).toFixed(2),d.dch.famille||'Évacuation']);
    }
  }
  rows.push(['','','','Totaux pour le poste :','','','','','','',+r.ds.toFixed(4),+(r.ds*Q).toFixed(2),'']);
  rows.push(['','','','Coefficient K','','','','','','',+r.K.toFixed(4),'','']);
  rows.push(['','','','Prix de vente HT','','','','','','',r.pv,+(r.pv*Q).toFixed(2),'']);
  rows.push([]);
  return rows;
}
const QDV_HEAD=['N°','Code','Type','Désignation','UO','Formule','Quantité déboursé','Quantité ouvrage','Rendement (UO/j)','PU','Déboursé unitaire','Déboursé total','Famille'];
function exportXLSX(list,base){
  if(!window.XLSX){toast('Export Excel indisponible (bibliothèque non chargée)');return}
  const rows=[QDV_HEAD];list.forEach(o=>rows.push(...qdvRows(o)));
  const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[6,22,6,48,6,24,14,12,12,10,14,14,14].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,'Détail QDV');
  const rec=[['Code','Désignation','UO','Quantité','Rendement (UO/j)',"Main-d'œuvre",'Matériel','Matériaux','Évacuation','Sous-traitance','Déboursé sec','K','Prix de vente HT','Total vente HT']];
  list.forEach(o=>{const r=compute(o);const b=r.blocs;const f=v=>+v.toFixed(4);rec.push([o.code,o.des,o.unite,r.Q||'',r.R||'',f(b.MO),f(b.MAT),f(b.FOUR),f(b.EVAC),f(b.ST),f(r.ds),+r.K.toFixed(4),r.pv,r.Q>0?+(r.pv*r.Q).toFixed(2):''])});
  const ws2=XLSX.utils.aoa_to_sheet(rec);ws2['!cols']=[22,48,6,10,12,12,12,12,12,12,12,8,12,14].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws2,'Récap');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const name=String(base).replace(/[\\/:*?"<>|]/g,'-').slice(0,80)+'.xlsx';
  saveFile(name,new Blob([buf]));
}
function copyText(t,ok){try{navigator.clipboard.writeText(t).then(()=>toast(ok),()=>fallbackCopy(t,ok))}catch(e){fallbackCopy(t,ok)}}
function fallbackCopy(t,ok){sheet('<h2>Copie manuelle</h2><p class="small muted" style="margin:0">Sélectionne le texte puis copie-le.</p><textarea id="cpT" style="width:100%;height:220px;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg)">'+esc(t)+'</textarea><button class="btn" id="cpX">Fermer</button>',()=>{const ta=$('#cpT');ta.focus();ta.select();$('#cpX').addEventListener('click',closeSheet)})}
function copyTSV(o){const rows=[QDV_HEAD,...qdvRows(o)];copyText(rows.map(r=>r.map(c=>typeof c==='number'?String(c).replace('.',','):String(c??'')).join('\t')).join('\n'),'Copié : colle dans Excel')}

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
